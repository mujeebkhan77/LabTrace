
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LabTrace - Report a Fault</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>

    <div class="dashboard-container">

        <!-- Sidebar -->
        <div class="sidebar">

            <div class="brand-logo">
                <div class="logo-icon">L</div>
                <span>LABTRACE</span>
            </div>

            <p class="menu-heading">MENU</p>

            <a href="student-dashboard.html" class="menu-link">
                Dashboard
            </a>

            <a href="report-fault.html" class="menu-link active">
                Report a Fault
            </a>

            <a href="my-complaints.html" class="menu-link">
                My Complaints
            </a>

            <div class="sidebar-bottom">
                <a href="index.html" class="menu-link">Logout</a>
            </div>

        </div>

        <!-- Main Content -->
        <div class="main-content">

            <!-- Topbar -->
            <div class="topbar">
                <div>
                    <h5>Report a Fault</h5>
                    <p>Submit a computer issue from your lab</p>
                </div>

                <div class="student-info">
                    <div class="student-avatar">S</div>
                    <div>
                        <strong>Student Name</strong>
                        <small>BS Software Engineering</small>
                    </div>
                </div>
            </div>

            <!-- Page Heading -->
            <div class="page-heading">
                <h2>Report a Computer Issue</h2>
                <p>Provide the computer details and describe the problem you are facing.</p>
            </div>

            <!-- Complaint Form -->
            <div class="report-form">

                <form>

                    <div class="mb-4">
                        <label for="computerId" class="form-label">
                            Computer ID
                        </label>

                        <input type="text" class="form-control"
                               id="computerId" placeholder="e.g. PC-204">
                    </div>

                    <div class="mb-4">
                        <label for="labName" class="form-label">
                            Lab Name
                        </label>

                        <input type="text" class="form-control"
                               id="labName" placeholder="e.g. Computer Lab 2">
                    </div>

                    <div class="mb-4">
                        <label for="issueType" class="form-label">
                            Issue Category
                        </label>

                        <select class="form-select" id="issueType">
                            <option value="">Select an issue</option>
                            <option>Hardware Problem</option>
                            <option>Software Problem</option>
                            <option>Network Problem</option>
                            <option>Power Problem</option>
                            <option>Other</option>
                        </select>
                    </div>

                    <div class="mb-4">
                        <label for="description" class="form-label">
                            Problem Description
                        </label>

                        <textarea class="form-control" id="description"
                                  rows="5"
                                  placeholder="Describe the problem you are facing..."></textarea>
                    </div>

                    <button type="button" class="btn login-btn">
                        Submit Complaint →
                    </button>

                </form>

            </div>

        </div>

    </div>

</body>
</html>
